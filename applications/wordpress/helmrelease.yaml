apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 10m
  valuesFrom:
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: wordpressUsername
      targetPath: wordpressUsername
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: wordpressPassword
      targetPath: wordpressPassword
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: wordpressEmail
      targetPath: wordpressEmail
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: mariadbDatabase
      targetPath: mariadb.auth.database
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: mariadbUsername
      targetPath: mariadb.auth.username
    - kind: Secret
      name: wordpress-runtime-values
      valuesKey: mariadbPassword
      targetPath: mariadb.auth.password
  chart:
    spec:
      chart: wordpress
      version: "28.1.2"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  install:
    createNamespace: true
  values:
    service:
      type: ClusterIP
    mariadb:
      primary:
        persistence:
          size: 4Gi
    persistence:
      size: 4Gi
