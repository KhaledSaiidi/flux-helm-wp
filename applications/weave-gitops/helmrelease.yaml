apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ww-gitops
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/weaveworks/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ww-gitops
  namespace: flux-system
spec:
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: weave-gitops-runtime-values
      valuesKey: adminUserUsername
      targetPath: adminUser.username
    - kind: Secret
      name: weave-gitops-runtime-values
      valuesKey: adminUserPasswordHash
      targetPath: adminUser.passwordHash
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: ww-gitops
        namespace: flux-system
  values:
    adminUser:
      create: true
    image:
      tag: v0.39.1-rc.1
