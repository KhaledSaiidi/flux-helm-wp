# Applications Kustomization - deploys WordPress (depends on infrastructure)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 10m
  path: ./applications
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: OCIRepository
    name: flux-system
